services:
  db:
    image: pgvector/pgvector:pg16
    container_name: portoai-pgvector
    environment:
      POSTGRES_USER: portoai
      POSTGRES_PASSWORD: portoai
      POSTGRES_DB: portoai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portoai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
